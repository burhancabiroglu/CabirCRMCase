version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cabircrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123
      POSTGRES_DB: CRM_DB
    ports:
      - "5432:5432"
    volumes:
      - cabircrm_postgres_data:/var/lib/postgresql/data
    networks:
      - cabircrm_network

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cabircrm_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=CRM_DB;Username=postgres;Password=Password123;
    ports:
      - "5001:5001"
    depends_on:
      - postgres
    networks:
      - cabircrm_network

volumes:
  cabircrm_postgres_data:

networks:
  cabircrm_network: